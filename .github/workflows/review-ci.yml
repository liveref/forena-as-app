name: Review build and verify
on:
  push:
    branches: [forena-v2-review]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify original product data and category mapping
        run: node --test tests/*.test.mjs
      - name: Verify React and Vite build (does not deploy)
        run: npm run build
